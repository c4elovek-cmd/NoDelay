[[mods]]
modId="nodelay"
version="2.1.0"
displayName="NoDelay"
logoFile="nodelay/icon.png"
credits="Stepan"
authors="Stepan"
description='''Selectively removes the vanilla 4 tick right-click delay (Minecraft#rightClickDelay). Separate settings for placing blocks, trading with villagers, other entities and using items in the air. Each category is configurable from 0 to 20 ticks (vanilla is 4) via config/nodelay.json. Client-side only. Localized into 14 languages.'''

